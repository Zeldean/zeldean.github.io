<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dean van Zyl's CV website">
    <meta name="keywords" content="Dean, Dean van Zyl, Software Engineering Student">
    <meta name="author" content="Dean van Zyl">
    <title>Dean van Zyl — Software Engineering Student</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout-header.css">
    <link rel="stylesheet" href="css/layout-nav.css">
    <link rel="stylesheet" href="css/layout-body.css">
    <link rel="stylesheet" href="css/layout-footer.css">
</head>

<script src="js/splashHeaderController.js" defer></script>
<script src="js/navController.js" defer></script>
<script src="js/cvDownloadHandler.js" defer></script>
<script type="module" src="js/dataLoader.js" defer></script>


<body>
    <div id="splash-overlay"></div>
    <header id="splash-bubble">
        <h1>Dean van Zyl</h1>
        <p>Software Engineering Student</p>
    </header>    

    <div id="vertical-nav-container", class="active">
        <nav id="site-nav">
            <ul class="nav-list">
            <li><a href="#about">About Me</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="#education">Education</a></li>
            <li><a href="#projects">Projects</a></li>
            <!-- <li><a href="#extracurricular">Extracurricular</a></li> -->
            <li><a href="#contact">Contact</a></li>
            <li><a href="#cv">My CV</a></li>
            </ul>
        </nav>
    </div>

    <div id="nav-toggle" class="nav-toggle">
        <img src="assets/icons/icon_menu.png" alt="Menu Icon">
    </div>
    <div id="nav-spacer"></div>

    <main>
        <!-- ABOUT ME -->
        <section id="about" class="section section--about">
            <div class="container">
                <h2 class="section-title">About Me</h2>
                <div class="about-top d-flex flex-center">
                    <div class="about-photo">
                        <img src="./assets/profile.jpg" alt="Photo of Dean van Zyl in formal attire">
                    </div>
                    <ul class="about-details">
                        <!-- JS will inject list items here -->
                    </ul>
                </div>
                <div class="about-bottom">
                    <p class="about-bio">
                        <!-- JS will inject summary here -->
                    </p>
                    <div class="social-links">
                        <!-- JS will inject social icons here -->
                    </div>
                </div>
            </div>
        </section>

        <!-- SKILLS -->
        <section id="skills" class="section section--skills">
            <div class="container">
                <h2 class="section-title">Skills</h2>
                <div class="skills-grid">
                    <!-- JS will inject skills categories here -->
                </div>
            </div>
        </section>

        <!-- EXPERIENCE -->
        <section id="experience" class="section section--experience">
            <div class="container">
                <h2 class="section-title">Experience</h2>
                <div id="experience-list">
                    <!-- JS will inject experience here -->
                </div>
            </div>
        </section>

        <!-- EDUCATION -->
        <section id="education" class="section section--education">
            <div class="container">
                <h2 class="section-title">Education</h2>
                <div id="education-list">
                    <!-- JS will inject education here -->
                </div>
            </div>
        </section>

        <!-- PROJECTS -->
        <section id="projects" class="section section--projects">
        <div class="container">
            <h2 class="section-title">Projects</h2>
            <ul class="project-list"><!-- JS will inject projects here --></ul>
        </div>
        </section>

        <!-- EXTRACURRICULAR -->
        <!-- <section id="extracurricular" class="section section--extracurricular">
            <div class="container">
                <h2 class="section-title">Extracurricular Activities</h2>
                <ul id="extracurricular-list"> -->
                    <!-- JS will inject here -->
                <!-- </ul>
            </div>
        </section> -->

        <!-- CONTACT -->
        <section id="contact" class="section section--contact">
            <div class="container">
                <h2 class="section-title">Contact</h2>
                <div id="contact-info">
                    <!-- JS will inject contact info here -->
                </div>
            </div>
        </section>

        <!-- DOWNLOAD CV -->
        <section id="cv" class="section section--cv">
            <div class="container text-center">
                <h2 class="section-title">My CV</h2>
                <button id="downloadCv">Download My CV (PDF)</button>
            </div>
        </section>

        <!-- TO TOP BTN -->
        <button id="backToTop" class="btn btn-outline btn-small" aria-label="Back to top">
            ↑ Top
        </button>

    </main>

    <footer class="site-footer">
        <p>© 2024 Dean van Zyl. All Rights Reserved.</p>
    </footer>  
</body>
</html>
